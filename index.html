<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moda Zerina | Yakında</title>

  <style>
    :root {
      --primary: #01362a;
      --overlay: rgba(255, 255, 255, 0.65);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Playfair Display", serif;
      background: url("Bg.jpg") center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      background: var(--overlay);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .content {
      text-align: center;
      max-width: 720px;
      color: var(--primary);
    }

    .brand {
      font-family: "Inter", sans-serif;
      letter-spacing: 2px;
      font-size: 12px;
      margin-bottom: 24px;
      opacity: 0.7;
    }

    h1 {
      font-size: 56px;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .text {
      font-family: "Inter", sans-serif;
      font-size: 16px;
      margin-bottom: 36px;
      opacity: 0.85;
    }

    .button {
      display: inline-block;
      padding: 12px 36px;
      border-radius: 999px;
      background: white;
      color: var(--primary);
      font-family: "Inter", sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      margin-bottom: 48px;
    }

    .social {
      display: flex;
      justify-content: center;
      gap: 18px;
    }

    .social a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(1,54,42,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .social svg {
      width: 20px;
      height: 20px;
      fill: var(--primary);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <div class="content">

      <div class="brand">MODA ZERINA</div>

      <h1>Yakında</h1>

      <div class="text">
        Her kadına özel, zerin bir dokunuş.<br />
        Özel dikim koleksiyonumuz çok yakında sizlerle.
      </div>

      <a class="button" href="https://www.instagram.com/modazerina" target="_blank">
        Bizi Takip Edin
      </a>

      <div class="social">
        <a href="https://www.instagram.com/modazerina" target="_blank" aria-label="Instagram">
          <svg viewBox="0 0 24 24">
            <path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-.9a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2z"/>
          </svg>
        </a>
      </div>

    </div>
  </div>
</body>
</html>
