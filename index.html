<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modazerina | Yakında</title>

  <style>
    :root {
      --primary: #01362a;
      --bg: #f7f5f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--primary);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      max-width: 640px;
      padding: 40px 24px;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 48px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }

    .slogan {
      font-size: 16px;
      font-style: italic;
      margin-bottom: 32px;
      opacity: 0.9;
    }

    .description {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .status {
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: 1px solid var(--primary);
      display: inline-block;
      padding: 10px 24px;
      border-radius: 999px;
    }

    footer {
      margin-top: 48px;
      font-size: 12px;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .description {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Modazerina</h1>

    <div class="slogan">
      Her kadına özel, zerin bir dokunuş.
    </div>

    <div class="description">
      Tesettür giyimde modern zarafet, zamansız şıklık ve
      <strong>özel dikim</strong> anlayışıyla hazırlanan koleksiyonlar
      çok yakında sizinle.
    </div>

    <div class="status">
      Yakında Hizmetinizdeyiz
    </div>

    <footer>
      © Modazerina
    </footer>
  </div>
</body>
</html>
