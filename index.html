<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moda Zerina</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Playfair Display", serif;
      background: url("bg2.jpg") center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
    }

    /* Fotoğrafı bozmadan derinlik */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
    }

    .content {
      position: relative;
      text-align: center;
      max-width: 760px;
      padding: 40px 24px;
    }

    .logo {
      margin-bottom: 36px;
    }

    .logo img {
      max-width: 170px;
    }

    h1 {
      font-size: 56px;
      font-weight: 500;
      margin-bottom: 28px;
      line-height: 1.15;
    }

    .text {
      font-family: "Inter", sans-serif;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 52px;
      opacity: 0.9;
    }

    .social {
      display: flex;
      justify-content: center;
    }

    .social a {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social a:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-2px);
    }

    .social svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 40px;
      }

      .text {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="content">

    <div class="logo">
      <img src="LogoB.png" alt="Moda Zerina Logo">
    </div>

    <h1>
      Her kadına özel,<br>
      zerin bir dokunuş.
    </h1>

    <div class="text">
      Özel dikim anlayışıyla hazırlanan koleksiyonumuz,<br>
      sessiz bir zarafet ve güçlü bir duruş sunar.
    </div>

    <div class="social">
      <a href="https://www.instagram.com/modazerina" target="_blank" aria-label="Instagram">
        <svg viewBox="0 0 24 24">
          <path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm10 2c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3h10zm-5 3a5 5 0 100 10 5 5 0 000-10zm0 2a3 3 0 110 6 3 3 0 010-6zm4.5-.9a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2z"/>
        </svg>
      </a>
    </div>

  </div>
</body>
</html>
